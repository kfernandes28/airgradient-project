services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - airgradient-postgres-data:/var/lib/postgresql
    networks:
      - airgradient-network
  collector:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - airgradient-network
  grafana:
    image: grafana/grafana
    restart: unless-stopped
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
    networks:
      - airgradient-network
    volumes:
      - airgradient-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

#By setting name:, we’re saying use this exact Docker volume name.
volumes: 
  airgradient-postgres-data:
    name: airgradient-postgres-data

  airgradient-grafana-data:
    name: airgradient-grafana-data

networks:
  airgradient-network: